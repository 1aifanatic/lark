<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Content Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>LLM Extractor</h1>
    </header>

    <div class="page-info">
      <div class="page-type" id="pageType">
        <span class="type-badge webpage">Webpage</span>
      </div>
      <div class="url-container">
        <p class="page-url" id="pageUrl">Loading...</p>
        <button class="copy-url-btn" id="copyUrlBtn" title="Copy URL to clipboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="llm-selector">
      <div class="llm-header">
        <label>Send to:</label>
        <span class="llm-counter" id="llmCounter">0 selected</span>
      </div>
      <div class="llm-checkboxes" id="llmCheckboxes">
        <label class="llm-checkbox">
          <input type="checkbox" name="llm" value="chatgpt" checked>
          <span class="checkbox-label">ChatGPT</span>
        </label>
        <label class="llm-checkbox">
          <input type="checkbox" name="llm" value="gemini">
          <span class="checkbox-label">Gemini</span>
        </label>
        <label class="llm-checkbox">
          <input type="checkbox" name="llm" value="claude">
          <span class="checkbox-label">Claude</span>
        </label>
        <label class="llm-checkbox">
          <input type="checkbox" name="llm" value="grok">
          <span class="checkbox-label">Grok</span>
        </label>
        <label class="llm-checkbox">
          <input type="checkbox" name="llm" value="deepseek">
          <span class="checkbox-label">DeepSeek</span>
        </label>
        <label class="llm-checkbox">
          <input type="checkbox" name="llm" value="kimi">
          <span class="checkbox-label">Kimi</span>
        </label>
        <label class="llm-checkbox">
          <input type="checkbox" name="llm" value="qwen">
          <span class="checkbox-label">Qwen</span>
        </label>
      </div>
      <div class="select-actions">
        <button type="button" class="select-btn" id="selectAll">Select All</button>
        <button type="button" class="select-btn" id="clearAll">Clear</button>
      </div>
    </div>

    <div class="action-buttons">
      <button class="extract-btn" id="extractBtn">
        <span class="btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="btn-text" id="btnText">Extract & Send</span>
        <span class="keyboard-hint">⌘+Enter</span>
      </button>
      <button class="copy-btn" id="copyContentBtn" title="Copy content to clipboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
    </div>

    <div class="status-container" id="statusContainer">
      <div class="status" id="status"></div>
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText">Extracting transcript...</p>
    </div>

    <footer class="footer">
      <div class="keyboard-shortcuts" id="keyboardShortcuts">
        <div class="shortcuts-header" id="shortcutsToggle">
          <span>Keyboard Shortcuts</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="shortcuts-content" id="shortcutsContent">
          <div class="shortcut-item">
            <span class="shortcut-key">⌘/Ctrl + Enter</span>
            <span class="shortcut-desc">Extract & Send</span>
          </div>
          <div class="shortcut-item">
            <span class="shortcut-key">⌘/Ctrl + Shift + C</span>
            <span class="shortcut-desc">Copy Content</span>
          </div>
          <div class="shortcut-item">
            <span class="shortcut-key">⌘/Ctrl + Shift + U</span>
            <span class="shortcut-desc">Copy URL</span>
          </div>
        </div>
      </div>
      <button class="settings-btn" id="settingsBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2"/>
        </svg>
        Settings
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
